name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test README publishing
        run: node --test scripts/publish-readme-test-results.test.cjs

      - name: Build Docker images
        run: docker compose -f docker-compose.test.yml build

      - name: Run Playwright tests in Docker
        id: tests
        continue-on-error: true
        run: docker compose -f docker-compose.test.yml run --rm tests

      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-artifacts/playwright-report
          retention-days: 30

      - name: Update test results in README
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/publish-readme-test-results.sh "$TESTED_SHA" \
            test-artifacts/test-results/results.json \
            "$RUN_URL"

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
